<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>呼び出しボタン</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      background: #f4f1ea;
      color: #2b2b2b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
      -webkit-tap-highlight-color: transparent;
    }
    #place { font-size: 1.2rem; color: #666; min-height: 1.5em; }
    #btn {
      width: min(70vw, 320px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 35% 30%, #ff7a6b, #e0362a 60%, #b2241b);
      color: #fff;
      font-size: clamp(1.6rem, 7vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      box-shadow: 0 12px 0 #8e1c15, 0 18px 30px rgba(0,0,0,.25);
      cursor: pointer;
      transition: transform .08s, box-shadow .08s, filter .2s;
      user-select: none;
    }
    #btn:active:not(:disabled) {
      transform: translateY(10px);
      box-shadow: 0 2px 0 #8e1c15, 0 6px 12px rgba(0,0,0,.25);
    }
    #btn:disabled { filter: grayscale(.8) brightness(1.1); cursor: default; }
    #status { font-size: 1.2rem; min-height: 1.6em; text-align: center; }
    #status.ok { color: #1f8a4c; }
    #status.err { color: #c0392b; }
  </style>
</head>
<body>
  <div id="place"></div>
  <button id="btn" type="button">呼び出し</button>
  <div id="status" role="status" aria-live="polite"></div>

  <script>
    const COOLDOWN_SEC = 30; // 連打防止（秒）

    // ?place=受付 のようにURLで場所を指定できる（QRコードを場所ごとに作る用）
    const place = (new URLSearchParams(location.search).get('place') || '').slice(0, 30);
    if (place) document.getElementById('place').textContent = `📍 ${place}`;

    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    function setStatus(text, cls = '') {
      status.textContent = text;
      status.className = cls;
    }

    function startCooldown(sec) {
      btn.disabled = true;
      let left = sec;
      btn.textContent = `${left}`;
      const t = setInterval(() => {
        left--;
        if (left <= 0) {
          clearInterval(t);
          btn.disabled = false;
          btn.textContent = '呼び出し';
          setStatus('');
        } else {
          btn.textContent = `${left}`;
        }
      }, 1000);
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      setStatus('送信中…');
      try {
        const res = await fetch('/api/call', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ place }),
        });
        if (res.ok) {
          setStatus('お呼びしました。少々お待ちください。', 'ok');
          startCooldown(COOLDOWN_SEC);
        } else if (res.status === 429) {
          setStatus('ただいま呼び出し済みです。少々お待ちください。', 'ok');
          startCooldown(10);
        } else {
          throw new Error(res.status);
        }
      } catch (e) {
        setStatus('送信に失敗しました。もう一度押してください。', 'err');
        btn.disabled = false;
        btn.textContent = '呼び出し';
      }
    });
  </script>
</body>
</html>
